<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Аким на 5 часов</title>
  <style>
    :root{--navy:#0a1d3b;--ink:#142b4a;--blue:#2368e8;--sky:#eaf3ff;--mint:#d8f7ed;--line:#dbe6f4;--muted:#6883a3;--red:#bd2937;--green:#087e57;--shadow:0 16px 38px rgba(20,47,87,.10)}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eef5ff 0,#f8fbff 42%,#f4f7fb 100%)}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 83% 8%,#56b7ff 0,transparent 26%),linear-gradient(125deg,#071a36,#0c3670 58%,#1761bd);color:#fff;padding:55px max(24px,calc((100% - 1120px)/2)) 64px}.hero:after,.hero:before{content:"";position:absolute;border:1px solid #ffffff2b;border-radius:50%;pointer-events:none}.hero:after{width:390px;height:390px;right:-110px;bottom:-260px}.hero:before{width:240px;height:240px;right:21%;top:-145px}.eyebrow{margin:0 0 10px;color:#a9d8ff;font-weight:800;font-size:12px;letter-spacing:.13em;text-transform:uppercase}.hero h1{position:relative;font-size:clamp(34px,5vw,57px);line-height:1.04;letter-spacing:-.045em;margin:0}.hero p{position:relative;max-width:640px;font-size:18px;margin:16px 0 0;color:#dcecff}.shell{max-width:1120px;margin:-25px auto 50px;padding:0 20px}.notice,.score,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.notice{position:relative;display:flex;justify-content:space-between;align-items:center;padding:19px 22px;margin-bottom:25px}.notice strong{font-size:17px}.budget{font-weight:850;font-size:17px;color:#1354bd;background:var(--sky);padding:9px 13px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow:auto;padding:2px 2px 12px}.card{min-width:190px;padding:17px;transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 20px 35px rgba(20,47,87,.14)}.initiative{border-top:4px solid var(--accent,#2368e8)}.direction-transport{--accent:#356ae6}.direction-green{--accent:#14a878}.direction-social{--accent:#e07b25}.direction-safety{--accent:#7655cf}.direction-services{--accent:#1aa3b7}.card h2{font-size:16px;margin:0 0 5px;text-transform:capitalize}.choice{display:grid;gap:9px;margin-top:13px}select{width:100%;appearance:none;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fbfdff;color:var(--ink);font:inherit;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}select:focus{border-color:#4b88ed;box-shadow:0 0 0 3px #dceafe}button{margin:21px 0 28px;border:0;border-radius:11px;background:linear-gradient(135deg,#2368e8,#1554c5);color:#fff;font:800 15px inherit;padding:14px 21px;box-shadow:0 9px 18px #1e65db42;cursor:pointer;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-2px);box-shadow:0 13px 24px #1e65db4d}button:disabled{background:#9cb8d9;box-shadow:none;cursor:not-allowed;transform:none}.error{color:var(--red);font-weight:700;background:#fff0f1;padding:11px 13px;border-radius:9px}.score{padding:23px;margin-bottom:18px;border-left:5px solid var(--blue)}.score h2{font-size:43px;line-height:1;margin:5px 0;letter-spacing:-.04em}.delta{display:inline-block;color:var(--green);font-weight:800;background:var(--mint);padding:4px 8px;border-radius:7px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:16px 0}.district{border-top:4px solid #2774e8}.district h3{margin:0;font-size:20px}.district b{display:inline-block;font-size:25px;margin-top:7px}.muted{color:var(--muted);font-size:14px}.hidden{display:none}ul{padding-left:19px;margin:9px 0}.tag{display:inline-block;background:#edf4ff;color:#54779f;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:650;margin:3px 2px 0 0}#ai-analysis{margin:18px 0;background:linear-gradient(130deg,#eef6ff,#fff)}#ai-analysis h3{margin:0 0 7px;color:#164a9b}@media(max-width:700px){.hero{padding:38px 20px 55px}.hero p{font-size:16px}.notice{align-items:flex-start;gap:12px;flex-direction:column}.score h2{font-size:36px}}
  </style>
</head>
<body>
<header class="hero"><p class="eyebrow">Городская лаборатория · Астана</p><h1>Аким на 5 часов</h1><p>Распределите бюджет между пятью инициативами и узнайте, как решения изменят качество жизни в районах условной Астаны.</p></header>
<main class="shell"><section class="notice"><div><strong>Ровно 5 решений.</strong><br><span class="muted">Не более двух инициатив одного направления.</span></div><div class="budget" id="budget">Загрузка бюджета…</div></section><p class="error hidden" id="error"></p><section class="grid" id="choices"></section><button id="run">Рассчитать сценарий</button><section id="out" class="hidden"></section></main>
<script>
let catalog, selected={transport:[],green:[],social:[],safety:[],services:[]};
const labels={transport:'Транспорт',green:'Озеленение',social:'Соцсфера',safety:'Безопасность',services:'Сервисы'};
const el=x=>document.getElementById(x), esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function init(){catalog=await fetch('/api/catalog').then(r=>r.json());el('budget').textContent=`Бюджет: ${catalog.budget} ед. · выбрано: 0 / 5`;render();}
function render(){let groups={};catalog.initiatives.forEach(x=>(groups[x.direction]??=[]).push(x));el('choices').innerHTML=Object.entries(groups).map(([dir,items])=>`<article class="card initiative direction-${dir}"><h2>${labels[dir]}</h2><span class="muted">Можно выбрать до 2 мер</span><div class="choice">${[0,1].map(n=>`<select data-dir="${dir}" data-n="${n}"><option value="">— не выбрано —</option>${items.map(i=>`<option value="${i.id}" ${selected[dir][n]?.id===i.id?'selected':''}>${i.id}: ${i.name} (${i.cost})</option>`).join('')}</select><select class="district hidden" data-district="${dir}-${n}"></select>`).join('')}</div></article>`).join('');document.querySelectorAll('[data-dir]').forEach(s=>s.onchange=change);updateDistricts();updateBudget();}
function change(e){let d=e.target.dataset.dir,n=+e.target.dataset.n,id=e.target.value;selected[d][n]=catalog.initiatives.find(x=>x.id===id);updateDistricts();updateBudget();}
function updateDistricts(){document.querySelectorAll('[data-dir]').forEach(s=>{let x=selected[s.dataset.dir][s.dataset.n], d=document.querySelector(`[data-district="${s.dataset.dir}-${s.dataset.n}"]`);if(x?.scope==='district'){d.classList.remove('hidden');let old=d.value;d.innerHTML='<option value="">Выберите район</option>'+catalog.districts.map(z=>`<option value="${z.id}">${z.name}</option>`).join('');d.value=old;}else d.classList.add('hidden');});}
function getChoices(){return Object.entries(selected).flatMap(([dir,arr])=>arr.map((x,n)=>{if(!x)return null;let s=document.querySelector(`[data-dir="${dir}"][data-n="${n}"]`),d=document.querySelector(`[data-district="${dir}-${s.dataset.n}"]`);return {initiative_id:x.id,district_id:x.scope==='district'?d.value:''}}).filter(Boolean));}
function updateBudget(){let c=getChoices(),spent=c.reduce((n,x)=>n+catalog.initiatives.find(i=>i.id===x.initiative_id).cost,0);el('budget').textContent=`Бюджет: ${catalog.budget-spent} из ${catalog.budget} ед. · выбрано: ${c.length} / 5`;el('run').disabled=spent>catalog.budget;}
el('run').onclick=async()=>{let choices=getChoices(),err=el('error');err.classList.add('hidden');try{let r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choices})});let data=await r.json();if(!r.ok){err.textContent=data.error;err.classList.remove('hidden');return}show(data);triggerAnalysis(data)}catch{err.textContent='Сервер недоступен. Запустите его командой: go run ./cmd/api';err.classList.remove('hidden')}};
async function triggerAnalysis(result){let box=el('ai-analysis');box.classList.remove('hidden');box.innerHTML='<h3>AI-анализ сценария</h3><p class="muted">Анализируем сценарий…</p>';try{let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result})});let data=await r.json();if(!r.ok || !data.ok){throw new Error(data.error || 'AI-анализ временно недоступен.')}showAnalysis(data.analysis)}catch(e){box.innerHTML=`<h3>AI-анализ сценария</h3><p class="muted">${esc(e.message || 'AI-анализ временно недоступен.')}</p>`}}
function showAnalysis(a){let box=el('ai-analysis');box.classList.remove('hidden');box.innerHTML=`<h3>AI-анализ сценария</h3><p><strong>Вывод</strong><br>${esc(a.summary || '')}</p><div class="results"><article class="card"><h3>Сильные стороны</h3><ul>${(a.strengths||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>Риски</h3><ul>${(a.risks||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>Компромиссы</h3><ul>${(a.tradeoffs||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>Синергии</h3><ul>${(a.synergies||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article><article class="card"><h3>Рекомендации</h3><ul>${(a.recommendations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article></div>`;}
function show(r){let sign=r.delta>=0?'+':'';el('out').classList.remove('hidden');el('out').innerHTML=`<section class="score"><span class="muted">Astana Quality of Life Score</span><h2>${r.score}</h2><span class="delta">${sign}${r.delta} к базовому ${r.baselineScore}</span><p>Потрачено ${r.spent} из ${r.budget}; критических показателей: ${r.criticalCount}.</p><strong>Сильные стороны</strong><ul>${r.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Риски и рекомендации</strong><ul>${[...r.risks,...r.recommendations].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section id="ai-analysis" class="card"><h3>AI-анализ сценария</h3><p class="muted">Подготавливаем анализ…</p></section><div class="results">${r.districts.map(d=>`<article class="card district"><h3>${d.name}</h3><b>${d.score}</b> <span class="muted">балл района</span><p class="muted">${Object.entries(d.after).map(([k,v])=>`<span class="tag">${k.toUpperCase()} ${Number(v).toFixed(1)}</span>`).join('')}</p></article>`).join('')}</div>`;el('out').scrollIntoView({behavior:'smooth'});}
init().catch(()=>{el('error').textContent='Не удалось получить каталог. Проверьте, что сервер запущен.';el('error').classList.remove('hidden')});
</script></body></html>
