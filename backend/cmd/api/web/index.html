<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Аким на 5 часов</title>
  <style>
    :root{--ink:#102a43;--blue:#1769e0;--pale:#f2f7ff;--line:#d5dfed;--red:#b42318;--green:#087443}*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:#f6f8fb}.hero{background:linear-gradient(115deg,#0c3775,#1676c5);color:white;padding:42px max(24px,calc((100% - 1120px)/2))}.hero h1{font-size:clamp(30px,5vw,52px);margin:0}.hero p{max-width:670px;font-size:18px;opacity:.92}.shell{max-width:1120px;margin:28px auto;padding:0 20px}.notice,.score,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 15px #16365b0a}.notice{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.budget{font-weight:800;font-size:20px;color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow:auto;padding-bottom:6px}.card{min-width:190px}.card h2{font-size:16px;margin:0 0 12px;text-transform:capitalize}.choice{display:grid;gap:9px;margin-top:10px}select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:white;color:var(--ink)}button{margin:24px 0;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;padding:13px 20px;cursor:pointer}button:disabled{background:#9cb8d9;cursor:not-allowed}.error{color:var(--red);font-weight:600}.score{margin-bottom:18px}.score h2{font-size:30px;margin:0}.delta{color:var(--green);font-weight:700}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.district{border-top:4px solid var(--blue)}.district h3{margin:0}.muted{color:#627d98;font-size:14px}.hidden{display:none}ul{padding-left:19px;margin:8px 0}.tag{display:inline-block;background:var(--pale);padding:2px 7px;border-radius:999px;font-size:12px;margin:3px 2px 0 0}@media(max-width:700px){.hero{padding:28px 20px}.notice{align-items:flex-start;gap:10px;flex-direction:column}}
  </style>
</head>
<body>
<header class="hero"><h1>Аким на 5 часов</h1><p>Распределите бюджет между пятью инициативами и узнайте, как решения изменят качество жизни в районах условной Астаны.</p></header>
<main class="shell"><section class="notice"><div><strong>Ровно 5 решений.</strong><br><span class="muted">Не более двух инициатив одного направления.</span></div><div class="budget" id="budget">Загрузка бюджета…</div></section><p class="error hidden" id="error"></p><section class="grid" id="choices"></section><button id="run">Рассчитать сценарий</button><section id="out" class="hidden"></section></main>
<script>
let catalog, selected={transport:[],green:[],social:[],safety:[],services:[]};
const labels={transport:'Транспорт',green:'Озеленение',social:'Соцсфера',safety:'Безопасность',services:'Сервисы'};
const el=x=>document.getElementById(x), esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function init(){catalog=await fetch('/api/catalog').then(r=>r.json());el('budget').textContent=`Бюджет: ${catalog.budget} ед. · выбрано: 0 / 5`;render();}
function render(){let groups={};catalog.initiatives.forEach(x=>(groups[x.direction]??=[]).push(x));el('choices').innerHTML=Object.entries(groups).map(([dir,items])=>`<article class="card"><h2>${labels[dir]}</h2><span class="muted">Можно выбрать до 2 мер</span><div class="choice">${[0,1].map(n=>`<select data-dir="${dir}" data-n="${n}"><option value="">— не выбрано —</option>${items.map(i=>`<option value="${i.id}" ${selected[dir][n]?.id===i.id?'selected':''}>${i.id}: ${i.name} (${i.cost})</option>`).join('')}</select><select class="district hidden" data-district="${dir}-${n}"></select>`).join('')}</div></article>`).join('');document.querySelectorAll('[data-dir]').forEach(s=>s.onchange=change);updateDistricts();updateBudget();}
function change(e){let d=e.target.dataset.dir,n=+e.target.dataset.n,id=e.target.value;selected[d][n]=catalog.initiatives.find(x=>x.id===id);updateDistricts();updateBudget();}
function updateDistricts(){document.querySelectorAll('[data-dir]').forEach(s=>{let x=selected[s.dataset.dir][s.dataset.n], d=document.querySelector(`[data-district="${s.dataset.dir}-${s.dataset.n}"]`);if(x?.scope==='district'){d.classList.remove('hidden');let old=d.value;d.innerHTML='<option value="">Выберите район</option>'+catalog.districts.map(z=>`<option value="${z.id}">${z.name}</option>`).join('');d.value=old;}else d.classList.add('hidden');});}
function getChoices(){return Object.entries(selected).flatMap(([dir,arr])=>arr.map((x,n)=>{if(!x)return null;let s=document.querySelector(`[data-dir="${dir}"][data-n="${n}"]`),d=document.querySelector(`[data-district="${dir}-${s.dataset.n}"]`);return {initiative_id:x.id,district_id:x.scope==='district'?d.value:''}}).filter(Boolean));}
function updateBudget(){let c=getChoices(),spent=c.reduce((n,x)=>n+catalog.initiatives.find(i=>i.id===x.initiative_id).cost,0);el('budget').textContent=`Бюджет: ${catalog.budget-spent} из ${catalog.budget} ед. · выбрано: ${c.length} / 5`;el('run').disabled=spent>catalog.budget;}
el('run').onclick=async()=>{let choices=getChoices(),err=el('error');err.classList.add('hidden');try{let r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choices})});let data=await r.json();if(!r.ok){err.textContent=data.error;err.classList.remove('hidden');return}show(data)}catch{err.textContent='Сервер недоступен. Запустите его командой: go run ./cmd/api';err.classList.remove('hidden')}};
function show(r){let sign=r.delta>=0?'+':'';el('out').classList.remove('hidden');el('out').innerHTML=`<section class="score"><span class="muted">Astana Quality of Life Score</span><h2>${r.score}</h2><span class="delta">${sign}${r.delta} к базовому ${r.baselineScore}</span><p>Потрачено ${r.spent} из ${r.budget}; критических показателей: ${r.criticalCount}.</p><strong>Сильные стороны</strong><ul>${r.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Риски и рекомендации</strong><ul>${[...r.risks,...r.recommendations].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><div class="results">${r.districts.map(d=>`<article class="card district"><h3>${d.name}</h3><b>${d.score}</b> <span class="muted">балл района</span><p class="muted">${Object.entries(d.after).map(([k,v])=>`<span class="tag">${k.toUpperCase()} ${Number(v).toFixed(1)}</span>`).join('')}</p></article>`).join('')}</div>`;el('out').scrollIntoView({behavior:'smooth'});}
init().catch(()=>{el('error').textContent='Не удалось получить каталог. Проверьте, что сервер запущен.';el('error').classList.remove('hidden')});
</script></body></html>
